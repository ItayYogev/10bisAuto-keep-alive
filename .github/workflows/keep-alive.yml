name: Keep Alive

on:
  schedule:
    - cron: '0 0 1 * *'  # Runs on the 1st of every month at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Push empty commit to keep workflows alive
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git pull --ff-only origin "${{ github.event.repository.default_branch }}"
          git commit --allow-empty -m "chore: keep workflows alive"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
